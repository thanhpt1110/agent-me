<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent-chat · Claude on this VM</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="env-banner" class="env-banner hidden"></div>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <h1>agent-chat</h1>
      <p>Persistent Claude Code sessions on this VM workspace.</p>
      <input id="token" type="password" placeholder="Access token" autocomplete="current-password" />
      <button type="submit">Enter</button>
      <div id="login-err" class="err"></div>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="brand">agent-chat</span>
        <button id="new-chat" title="New chat">+ New</button>
      </div>
      <ul id="session-list" class="session-list"></ul>
      <div class="sidebar-foot"><span id="conn" class="conn">●</span> <span id="conn-txt">connecting…</span></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div id="title" class="title">No session</div>
          <div id="cwd" class="cwd"></div>
        </div>
        <div id="status" class="status"></div>
      </header>
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Message the agent…  (Enter to send, Shift+Enter for newline)" disabled></textarea>
        <button id="send" type="submit" disabled>Send</button>
      </form>
    </main>
  </div>

  <template id="new-chat-tpl">
    <div class="modal-back">
      <div class="modal">
        <h2>New chat</h2>
        <label>Title <input name="title" placeholder="(auto from first message)" /></label>
        <label>Working dir <input name="cwd" placeholder="/home/thaphan/agent-me-qa-handsfree" /></label>
        <label>Model <input name="model" placeholder="(your default)" /></label>
        <div class="modal-actions">
          <button type="button" data-act="cancel">Cancel</button>
          <button type="button" data-act="create" class="primary">Create</button>
        </div>
      </div>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>
